name: Update contribution animation
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/contributions.yml']
permissions:
  contents: read
concurrency:
  group: profile-contributions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: frhandev
          outputs: |
            assets/contribution-dark.svg?palette=github-dark&color_snake=%238B5CF6&color_dots=%23172435,%2316445E,%23167A9F,%2306B6D4,%2322D3EE
            assets/contribution-light.svg?palette=github-light&color_snake=%236D28D9&color_dots=%23E2E8F0,%23BAE6FD,%237DD3FC,%230EA5E9,%23075985
      - name: Commit generated artwork
        run: |
          git add assets/contribution-dark.svg assets/contribution-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh contribution animation'
          git push origin HEAD:main
